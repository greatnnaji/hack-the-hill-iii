# Refresh news stories every 6 hours: Google News -> Gemini -> news_stories.json, committed back to the repo.
# Needs repo secret GEMINI_API_KEY.
name: News pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: news-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # GC InfoBase files (gitignored, too big to commit). Used for the department/program list.
      - name: Download spending data
        run: |
          mkdir -p pipeline/data
          base=https://open.canada.ca/data/dataset/a35cf382-690c-4221-a971-cf0fd189a46f/resource
          curl -sfL -o pipeline/data/programs_spending.csv $base/55934650-3380-44d5-82c1-bb68f8cc5abb/download/programs_spending.csv
          curl -sfL -o pipeline/data/programs.csv $base/8d3cd22d-15b0-468a-bb75-c1e736107c45/download/programs.csv
          curl -sfL -o pipeline/data/organizations.csv $base/d9f87f7f-62f9-4baf-a803-2d8743f38e76/download/organizations.csv

      - run: python3 pipeline/fetch_news.py

      - name: Build stories
        run: python3 pipeline/build_news.py

      # Commit the new articles + Gemini cache back, so the next run only reads new articles.
      # Pull first: someone may have pushed to main while this run was going.
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/news_raw.json pipeline/news_llm_cache.json pipeline/news_stories.json
          git diff --cached --quiet || (git commit -m "stories: refresh news stories" && git pull --rebase && git push)
